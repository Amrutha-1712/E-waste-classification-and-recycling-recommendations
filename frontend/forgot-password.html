<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030704">
<title>E-Waste Care | Forgot Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
:root{--green:#39ff88;--bg:#030704}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:#fff}
body::before,body::after{content:"";position:fixed;width:250px;height:250px;border-radius:50%;background:#00ff5530;filter:blur(65px);pointer-events:none}
body::before{top:-90px;left:-80px}body::after{right:-70px;bottom:-100px}
.card{position:relative;z-index:1;width:min(460px,100%);padding:38px;border:1px solid #39ff8855;border-radius:18px;background:#08110b;box-shadow:0 20px 70px #000}
.brand{margin-bottom:24px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:2px}
h1{margin-bottom:12px;font-size:30px}
.desc{margin-bottom:24px;color:#a6b8aa;font-size:14px;line-height:1.7}
.field{margin-bottom:18px}
label{display:block;margin-bottom:8px;color:#c9dfcf;font-size:11px;font-weight:700;letter-spacing:1px}
input{width:100%;padding:14px;border:1px solid #2b4331;border-radius:8px;outline:none;background:#050a06;color:#fff;font-size:14px}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #39ff8818}
.btn{width:100%;padding:14px;border:0;border-radius:8px;background:linear-gradient(100deg,#13c65a,#64ffa0);color:#031007;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:14px;color:#ff9999;font-size:13px;line-height:1.5}
.msg.success{color:var(--green)}
.links{margin-top:22px;text-align:center}
a{color:var(--green);font-size:13px;font-weight:700;text-decoration:none}
a:hover{text-decoration:underline}
@media(max-width:480px){.card{padding:27px 22px}h1{font-size:26px}}
</style>
</head>
<body>
<main class="card">
    <div class="brand">E-WASTE CARE · ACCOUNT RECOVERY</div>
    <h1>Forgot Password?</h1>
    <p class="desc">Enter your registered email address and we will send you a secure password reset link.</p>
    <form id="requestForm">
        <div class="field">
            <label for="email">REGISTERED EMAIL</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn" id="requestButton" type="submit">SEND RESET LINK</button>
    </form>
    <div class="msg" id="message" role="status" aria-live="polite"></div>
    <div class="links"><a href="/login">← Back to Login</a></div>
</main>
<script>
"use strict";

const form = document.getElementById("requestForm");
const emailInput = document.getElementById("email");
const button = document.getElementById("requestButton");
const message = document.getElementById("message");
let cooldownTimer;

function startCooldown(seconds) {
    clearInterval(cooldownTimer);
    let remaining = Math.max(1, seconds);
    button.disabled = true;
    button.textContent = `RESEND LINK IN ${remaining}s`;
    cooldownTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
            clearInterval(cooldownTimer);
            button.disabled = false;
            button.textContent = "RESEND RESET LINK";
            return;
        }
        button.textContent = `RESEND LINK IN ${remaining}s`;
    }, 1000);
}

if (new URLSearchParams(location.search).get("reset") === "invalid_token") {
    message.textContent = "That reset link is invalid or expired. Request a new one.";
}

form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!emailInput.reportValidity()) return;

    button.disabled = true;
    message.classList.remove("success");
    message.textContent = "Sending your reset link...";
    try {
        const response = await fetch("/api/password-reset/request-link", {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email: emailInput.value.trim()})
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            const error = new Error(result.message || "Unable to send a reset link.");
            error.retryAfter = result.retry_after;
            throw error;
        }
        message.classList.add("success");
        message.textContent = result.message;
        startCooldown(result.resend_after || 60);
    } catch (error) {
        message.textContent = error instanceof TypeError
            ? "Cannot connect to the server. Start the project backend and try again."
            : error.message;
        if (Number.isInteger(error.retryAfter)) {
            startCooldown(error.retryAfter);
        } else {
            button.disabled = false;
        }
    }
});
</script>
</body>
</html>
